# /etc/nginx/sites-available/recipes.tutormate.site
# HTTPS (сертификат Let's Encrypt) добавит certbot: certbot --nginx -d recipes.tutormate.site
server {
    listen 80;
    listen [::]:80;
    server_name recipes.tutormate.site;

    # Фото с телефона после сжатия занимают до ~1 МБ, с запасом
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
